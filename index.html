<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="format-detection" content="telephone=no">
<meta name="application-name" content="Lotus EduNest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lotus EduNest">
<title>Lotus EduNest · School Apps</title>
<meta name="description" content="Lotus EduNest - Official digital campus portal for Lotus International School parents and teachers.">
<meta property="og:title" content="Lotus EduNest · School Apps">
<meta property="og:description" content="Lotus EduNest - Official digital campus portal for Lotus International School parents and teachers.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F2F2F7">
<link rel="icon" href="school/logo-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/parent-180.png">
<link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/premium.css">
<link rel="stylesheet" href="assets/luxe.css">
<script src="config.js"></script>
<script type="module">
  import { CFG, h, icon, applyTheme, scheme, registerSW, demoBanner, brandMark, brandWordmark, themeBtn } from './assets/core.js';
  applyTheme(CFG.themeColor);
  registerSW();
  // each portal card wears its own app colour: Parent = blue (parentThemeColor), Teacher = plum (themeColor)
  const choice = (href, cls, ic, title, sub, hex) => {
    const c = scheme(hex);
    return h('a', { class: 'choice ' + cls, href, style: `--c-main:${c.primary};--c-cont:${c.primaryContainer};--c-on:${c.onPrimaryContainer};--c-deep:${c.primaryDeep};--c-bright:${c.primaryBright}` },
      h('div', { class: 'ci' }, icon(ic)), h('div', { class: 'ct' }, h('b', null, title), h('span', null, sub)), h('div', { class: 'go' }, icon('arrow_forward')));
  };
  document.getElementById('app').replaceChildren(h('div', { class: 'page' }, h('div', { class: 'chooser-top' }, themeBtn()), h('div', { class: 'content' }, h('div', { class: 'chooser' },
    brandWordmark() || h('div', null, brandMark('school-fill'), h('h1', null, 'Lotus EduNest')),
    h('p', null, 'Choose your portal to continue'),
    choice('parent/', 'a', 'family_restroom', 'Parent Portal', 'Fees, attendance, homework and school notices', CFG.parentThemeColor || '#0B57D0'),
    choice('teacher/', 'b', 'co_present', 'Teacher Portal', 'Post homework, enter exam marks and send class notices', CFG.themeColor || '#59164C'),
    demoBanner()))));
  if (CFG.schoolName) document.title = 'Lotus EduNest · ' + CFG.schoolName;
</script>
</head>
<body><div id="app"></div></body>
</html>
